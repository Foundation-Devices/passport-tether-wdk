[package]
name = "gui-app-tether-wdk"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = { workspace = true }
bitcoin = { version = "0.32.7", features = ["secp-recovery"] }
bt = { workspace = true }
fs = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
log-server = { workspace = true }
quantum-link = { workspace = true }
security = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
server = { workspace = true }
sha3 = "0.10.8"
slint-keyos-platform = { path = "../../slint-keyos-platform/runtime" }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
slint-keyos-platform-build = { path = "../../slint-keyos-platform/build", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
