#
# Companion link over QuantumLink, for --features quantum-link.
#
# These Wdk* messages are NOT part of stock KeyOS; keyos-patches/ adds them.
# Merge this block into permission_templates.toml and point app-config at it
# when building that variant. See docs/QUANTUM_LINK.md.

[companion-link]
"os/bt" = ["EnableBle", "GetBtAddr", "GetState", "SubscribeBleState", "Disconnect"]
"os/quantum-link" = [
    "GetXidDocument",
    "SubscribeConnectionStatus",
    "SubscribeWdkEvmAccountRequest",
    "SubscribeWdkEvmSignTransactionRequest",
    "SubscribeWdkRequestCancelled",
    "SendWdkEvmAccountResponse",
    "SendWdkEvmSignTransactionResponse",
    "SendWdkRequestRejected",
    "SubscribeWdkBtcAccountRequest",
    "SubscribeWdkBtcSignPsbtRequest",
    "SendWdkBtcAccountResponse",
    "SendWdkBtcSignPsbtResponse",
    "UnpairFromEnvoy",
]
